<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LH หลอมทอง Price Board</title>
<style>
  /* The board is drawn as a picture so every TV shows it exactly like a computer does. */
  html,body{margin:0;height:100%;overflow:hidden;background:#fff7dd}
  canvas{position:absolute;left:0;top:0}
  body.idle{cursor:none}
</style>
</head>
<body>
<canvas id="tv" width="1920" height="1080"></canvas>
<script>
const ROTATE_SECONDS = 15;
const CLOCK_BOX = { right: 1830, timeY: 185, dateY: 222 };   /* inside the red box at the top right of each image */
const cv = document.getElementById("tv"), ctx = cv.getContext("2d");
const stamp = Date.now();
let images = [], cur = 0;

function fit(){
  const w = window.innerWidth, h = window.innerHeight, k = Math.min(w / 1920, h / 1080);
  cv.style.width = 1920 * k + "px"; cv.style.height = 1080 * k + "px";
  cv.style.left = (w - 1920 * k) / 2 + "px"; cv.style.top = (h - 1080 * k) / 2 + "px";
}
window.addEventListener("resize", fit); fit();

let draw = function(){
  const img = images[cur];
  if (!img) return;
  ctx.drawImage(img, 0, 0, 1920, 1080);
  const d = new Date();
  const t = d.toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Bangkok"});
  const ds = d.toLocaleDateString("th-TH", {weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"Asia/Bangkok"});
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = '700 64px "LHClock", Georgia, serif';
  ctx.fillText(t, CLOCK_BOX.right, CLOCK_BOX.timeY);
  ctx.fillStyle = "#ffe9b0"; ctx.font = '600 21px "LHDate", Tahoma, sans-serif';
  ctx.fillText(ds, CLOCK_BOX.right, CLOCK_BOX.dateY);
}

function load(src, t){
  return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src + "?t=" + (t || stamp); });
}

const SILVER_GRADES = [95, 92.5, 90, 70, 50, 30];
const r50 = n => Math.round(n / 50) * 50;
const fmtKg = n => Math.round(n).toLocaleString("en-US");
const fmtG = n => Number.isInteger(n) ? n.toLocaleString("en-US") : n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
let silverBase = null, silverLayout = null, pgmImg = null, silverImg = null, sheetUrl = "";

/* silver: the shop types the 99.99% price; every grade = that x percent, rounded to 50 baht */
function silverValues(){
  const v = {"kg:99.99": silverBase, "g:99.99": silverBase / 1000};
  SILVER_GRADES.forEach(p => { const kg = r50(silverBase * p / 100); v["kg:" + p] = kg; v["g:" + p] = kg / 1000; });
  const out = {}; for (const k in v) out[k] = k.startsWith("kg:") ? fmtKg(v[k]) : fmtG(v[k]);
  return out;
}
function drawSilverNumbers(){
  if (!silverLayout || silverBase == null) return;
  const vals = silverValues();
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  silverLayout.lines.forEach(line => {
    const parts = line.pieces.map(p => ({...p, str: p.value ? vals[p.value] : p.text}));
    let scale = 1;
    const width = () => parts.reduce((w, p, i) => { ctx.font = p.font.replace(/([\d.]+)px/, (m, n) => (n * scale) + "px"); return w + (i ? p.gap * scale : 0) + ctx.measureText(p.str).width; }, 0);
    const room = Math.abs(line.limit - line.x) + (line.align === "right" ? 0 : 0);
    const avail = line.align === "right" ? line.x - line.limit : line.limit - line.x;
    let w = width();
    if (w > avail){ scale = avail / w * 0.98; w = width(); }
    let x = line.align === "right" ? line.x - w : line.x;
    parts.forEach((p, i) => {
      if (i) x += p.gap * scale;
      ctx.font = p.font.replace(/([\d.]+)px/, (m, n) => (n * scale) + "px");
      ctx.fillStyle = p.color;
      ctx.fillText(p.str, x, p.cy);
      x += ctx.measureText(p.str).width;
    });
  });
}

/* redefine draw: page 0 = platinum group image, page 1 = silver template + typed numbers */
draw = function(){
  const img = cur === 0 ? pgmImg : silverImg;
  if (!img) return;
  ctx.drawImage(img, 0, 0, 1920, 1080);
  if (cur === 1) drawSilverNumbers();
  const d = new Date();
  const t = d.toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Bangkok"});
  const ds = d.toLocaleDateString("th-TH", {weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"Asia/Bangkok"});
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffffff"; ctx.font = '700 64px "LHClock", Georgia, serif';
  ctx.fillText(t, CLOCK_BOX.right, CLOCK_BOX.timeY);
  ctx.fillStyle = "#ffe9b0"; ctx.font = '600 21px "LHDate", Tahoma, sans-serif';
  ctx.fillText(ds, CLOCK_BOX.right, CLOCK_BOX.dateY);
};

async function fetchText(u){ const r = await fetch(u, {cache:"no-store"}); if (!r.ok) throw new Error(r.status); return r.text(); }
function firstNumber(text){ const m = String(text).replace(/,/g, "").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }

async function refreshSilverPrice(){
  let v = null;
  if (sheetUrl){ try{ v = firstNumber(await fetchText(sheetUrl + (sheetUrl.includes("?") ? "&" : "?") + "t=" + Date.now())); }catch(e){} }
  if (v == null){ try{ v = JSON.parse(await fetchText("silver.json?t=" + Date.now())).pricePerKg; }catch(e){} }
  if (v != null && v > 1000 && v < 10000000 && v !== silverBase){ silverBase = v; draw(); }
}

async function refreshImages(){
  const t = Date.now();
  const [p, s] = await Promise.all([load("pgm.jpg", t), load("silver-blank.jpg", t)]);
  try{ silverLayout = JSON.parse(await fetchText("silver-layout.json?t=" + t)); }catch(e){}
  if (p) pgmImg = p; if (s) silverImg = s;
  draw();
}

/* double-click toggles fullscreen; cursor hides after 3 s */
document.addEventListener("dblclick", () => {
  try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
});
let idleT;
const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 3000); };
["mousemove","touchstart","keydown"].forEach(ev => document.addEventListener(ev, wake, {passive:true}));
wake();
/* every 10 minutes fetch fresh images in the background (no page reload, so fullscreen stays on) */
setInterval(refreshImages, 10 * 60 * 1000);
try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
