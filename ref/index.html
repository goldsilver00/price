<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d0c13">
<title>บัตรแนะนำเพื่อน · LH หลอมทอง</title>
<link rel="icon" href="img/logo-lh.png">
<style>
@font-face{font-family:'Anuphan';src:url('fonts/Anuphan.ttf') format('truetype');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Public Sans';src:url('fonts/PublicSans.ttf') format('truetype');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Bodoni Moda';src:url('fonts/Bodoni.ttf') format('truetype');font-weight:400 900;font-display:swap;}
:root{--wine:#6d0c13;--wine2:#4a1a1d;--red:#a31f24;--gold:#ffde59;--amber:#ffbd59;--cream:#fff8ec;--ink:#3b1f21;--muted:#8a6f71;--line:#efe3d3;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--cream);}
body{font-family:'Public Sans','Anuphan',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
body,input,button{font-family:'Anuphan','Public Sans',system-ui,sans-serif;}
.wrap{max-width:460px;margin:0 auto;padding:0 16px 40px;}
.hero{position:relative;background:linear-gradient(160deg,var(--wine) 0%,var(--wine2) 100%);color:#fff;padding:22px 20px 70px;border-radius:0 0 28px 28px;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,222,89,.28),rgba(255,222,89,0) 70%);}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;}
.brand b{display:block;color:var(--gold);font-size:17px;letter-spacing:.2px;}
.brand span{font-size:12px;opacity:.85;}
.hero h1{position:relative;z-index:1;margin-top:18px;font-size:24px;line-height:1.3;font-weight:700;}
.hero p{position:relative;z-index:1;font-size:14px;opacity:.9;margin-top:4px;max-width:250px;}
.hero .mascot{position:absolute;right:6px;bottom:-4px;width:150px;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));}
.test{background:#fff3cd;color:#7a5a00;font-size:12px;text-align:center;padding:6px 10px;}
.panel{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(109,12,19,.08);padding:18px;margin-top:-48px;position:relative;z-index:2;}
.panel+.panel,.sec{margin-top:14px;}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;}
input{width:100%;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fffdf9;color:var(--ink);letter-spacing:1px;outline:none;}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,189,89,.25);}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;background:var(--wine);color:#fff;margin-top:16px;}
.btn:active{transform:scale(.99);}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:var(--wine2);}
.btn.ghost{background:#fff;color:var(--wine);border:1.5px solid var(--line);}
.btn[disabled]{opacity:.6;}
.err{color:var(--red);font-size:14px;margin-top:10px;line-height:1.5;min-height:1em;}
.hi{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.hi b{font-size:18px;}
.hi small{display:block;color:var(--muted);font-size:12px;}
.line-chip{font-size:11px;background:#e9f9ef;color:#0f7a3c;border-radius:20px;padding:3px 9px;white-space:nowrap;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.stat{background:var(--cream);border-radius:12px;padding:10px 6px;text-align:center;}
.stat b{display:block;font-size:22px;color:var(--wine);font-family:'Public Sans','Anuphan',sans-serif;}
.stat span{font-size:12px;color:var(--muted);}
.sec h2{font-size:16px;margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;}
.sec h2 small{font-size:12px;color:var(--muted);font-weight:400;}
.card{background:#fff;border-radius:16px;box-shadow:0 3px 14px rgba(109,12,19,.07);margin-bottom:12px;overflow:hidden;border:1px solid #f6ece0;}
.card .top{display:flex;align-items:center;gap:8px;background:var(--wine);color:#fff;padding:8px 14px;font-size:12px;}
.card .top b{color:var(--gold);font-size:13px;}
.card .top .n{margin-left:auto;opacity:.8;}
.card .body{padding:12px 14px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;}
.code{font-family:'Public Sans',monospace;font-weight:800;font-size:26px;letter-spacing:3px;color:var(--wine);}
.bc{grid-column:1/-1;height:44px;margin-top:2px;}
.bc svg{width:100%;height:100%;display:block;}
.st{font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap;}
.st.new{background:#fff4d6;color:#8a5a00;}
.st.rsv,.st.wait{background:#e6efff;color:#1e40af;}
.st.ok{background:#dcfce7;color:#166534;}
.st.no{background:#fde2e2;color:#991b1b;}
.st.void{background:#eee;color:#666;}
.who{grid-column:1/-1;font-size:13px;color:var(--muted);}
.acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.acts button{border:1.5px solid var(--line);background:#fffdf9;border-radius:12px;padding:10px;font-size:14px;font-weight:600;color:var(--wine);cursor:pointer;}
.acts button.share{background:#06c755;border-color:#06c755;color:#fff;}
.card.used .bc,.card.used .acts{display:none;}
.rcwrap{border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(109,12,19,.22);}
.card.fresh{background:transparent;border:none;box-shadow:none;overflow:visible;}
.card.fresh .meta{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px;font-size:13px;color:var(--muted);}
.card.fresh .acts{margin-top:10px;}
.card.used .code{color:#b9a3a5;font-size:20px;}
.how{background:#fff;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.6;}
.how ol{padding-left:20px;}
.how li{margin:4px 0;}
.reward{margin-top:10px;background:linear-gradient(135deg,#fff7df,#ffeec4);border-radius:12px;padding:10px 12px;font-size:14px;}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:22px;}
.center{text-align:center;padding:30px 10px;}
.spin{width:34px;height:34px;border:3px solid #f1e3cf;border-top-color:var(--wine);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(30,10,12,.82);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;color:#fff;}
.ov img{max-width:100%;max-height:70vh;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);-webkit-touch-callout:default;}
.ov .t{font-size:15px;text-align:center;}
.ov .row{display:flex;gap:10px;}
.ov a,.ov button{background:#fff;color:var(--wine);border:none;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;}
.hidden{display:none !important;}
@media (min-width:600px){.hero{max-width:460px;margin:0 auto;}}
</style>
<style id="rc-css"></style>
</head>
<body>
<div id="test" class="test hidden">โหมดทดลอง · ยังไม่ได้เชื่อมกับ LINE</div>
<header class="hero">
  <div class="brand"><img src="img/logo-lh.png" alt=""><div><b>LH หลอมทอง</b><span>บัตรแนะนำเพื่อน</span></div></div>
  <h1 id="hero-title">ชวนเพื่อนมา<br>รับสิทธิ์จากร้าน</h1>
  <p id="hero-sub">ส่งรหัสของคุณให้เพื่อนที่ยังไม่เคยมาใช้บริการ</p>
  <img class="mascot" src="img/mascot-front.webp" alt="">
</header>
<main class="wrap" id="app">
  <div class="panel center"><div class="spin"></div>กำลังโหลด…</div>
</main>
<script>document.write('<script src="code128.js?t=' + Math.floor(Date.now() / 300000) + '"><\/script><script src="ref-card.js?t=' + Math.floor(Date.now() / 300000) + '"><\/script>');</script>
<script>
(function () {
  'use strict';
  // ข้อมูลบัตรอยู่ที่เซิร์ฟเวอร์โปรแกรมร้าน · หน้าเว็บนี้อยู่บน GitHub (แก้หน้าตาได้โดยไม่ต้อง deploy โปรแกรมร้าน)
  var API_BASE = 'https://pos.lhgoldgroup.com';
  var app = document.getElementById('app');
  var CFG = null, TOKEN = null, ME = null, LINE = { idToken: null, name: '' };
  var KEY = 'lh_ref_token';
  function store(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function thDate(d) {
    if (!d) return '';
    var p = String(d).slice(0, 10).split('-').map(Number);
    var m = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'][p[1] - 1];
    return p[2] + ' ' + m + ' ' + String((p[0] + 543) % 100).padStart(2, '0');
  }
  async function api(method, url, body) {
    var h = { 'Content-Type': 'application/json' };
    if (TOKEN) h.Authorization = 'Bearer ' + TOKEN;
    var r = await fetch(API_BASE + url, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined });
    var d = {}; try { d = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error(d.message || d.error || ('เกิดข้อผิดพลาด (' + r.status + ')')); err.status = r.status; err.code = d.error; throw err; }
    return d;
  }
  function message(title, text, mascot) {
    app.innerHTML = '<div class="panel center">' + (mascot ? '<img src="img/mascot-side.webp" alt="" style="width:120px;margin-bottom:8px">' : '') +
      '<h3 style="color:var(--wine);margin-bottom:6px">' + esc(title) + '</h3><p class="note" style="font-size:14px">' + esc(text) + '</p></div>';
  }
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }

  async function start() {
    try { CFG = await api('GET', '/api/ref-public/config'); } catch (e) { message('เชื่อมต่อไม่ได้', 'กรุณาลองใหม่อีกครั้ง'); return; }
    if (!CFG.enabled) { message('ปิดให้บริการชั่วคราว', 'ระบบบัตรแนะนำปิดอยู่ สอบถามพนักงานที่ร้านได้เลย', true); return; }
    if (CFG.test_mode) {
      document.getElementById('test').classList.remove('hidden');
      TOKEN = load();
      if (TOKEN) { try { await showMe(); return; } catch (e) { TOKEN = null; store(null); } }
      return showLogin();
    }
    // โหมด LINE: ต้องเปิดจากเมนูใน LINE เท่านั้น
    try {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: CFG.liff_id });
    } catch (e) { message('เปิดไม่สำเร็จ', 'กรุณาเปิดจากเมนู "บัตรแนะนำ" ใน LINE ของร้าน'); return; }
    if (!liff.isInClient()) { message('กรุณาเปิดใน LINE', 'บัตรแนะนำเปิดได้จากเมนูใน LINE Official ของร้าน LH หลอมทอง เท่านั้น', true); return; }
    if (!liff.isLoggedIn()) { liff.login(); return; }
    LINE.idToken = liff.getIDToken();
    try { var pf = await liff.getProfile(); LINE.name = pf.displayName || ''; } catch (e) {}
    try {
      var a = await api('POST', '/api/ref-public/auto', { id_token: LINE.idToken });
      if (a.linked) { TOKEN = a.token; return showMe(); }
    } catch (e) { message('ยืนยันบัญชี LINE ไม่สำเร็จ', e.message); return; }
    showLogin();
  }

  function showLogin() {
    document.getElementById('hero-title').innerHTML = 'ชวนเพื่อนมา<br>รับสิทธิ์จากร้าน';
    app.innerHTML =
      '<div class="panel">' +
      '<h3 style="color:var(--wine)">ยืนยันตัวตนครั้งแรก</h3>' +
      '<p class="note">สำหรับลูกค้าที่เคยใช้บริการร้าน LH หลอมทอง แล้ว</p>' +
      '<label for="ph">เบอร์โทรที่ให้ไว้กับร้าน</label><input id="ph" type="tel" inputmode="numeric" maxlength="12" placeholder="0xx-xxx-xxxx" autocomplete="tel">' +
      '<div class="note">ใช้เบอร์เดียวกับที่ให้พนักงานตอนทำรายการ</div>' +
      '<label for="id4">เลขท้ายบัตรประชาชน 4 ตัว</label><input id="id4" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">' +
      '<div class="err" id="err"></div>' +
      '<button class="btn" id="go">ดูบัตรแนะนำของฉัน</button>' +
      (CFG.test_mode ? '' : '<p class="note" style="text-align:center;margin-top:10px">บัตรจะผูกกับบัญชี LINE นี้ · ครั้งต่อไปเปิดได้ทันที</p>') +
      '</div>' + howHtml();
    var ph = document.getElementById('ph'), id4 = document.getElementById('id4'), go = document.getElementById('go'), err = document.getElementById('err');
    ph.addEventListener('input', function () { if (ph.value.replace(/\D/g, '').length >= 10) id4.focus(); });
    id4.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    go.addEventListener('click', submit);
    async function submit() {
      err.textContent = '';
      var phone = ph.value.replace(/\D/g, ''), d4 = id4.value.replace(/\D/g, '');
      if (!/^0\d{9}$/.test(phone)) { err.textContent = 'กรอกเบอร์โทร 10 หลัก'; ph.focus(); return; }
      if (d4.length !== 4) { err.textContent = 'กรอกเลขท้ายบัตรประชาชน 4 ตัว'; id4.focus(); return; }
      go.disabled = true; go.textContent = 'กำลังตรวจสอบ…';
      try {
        var r = await api('POST', '/api/ref-public/login', { phone: phone, id4: d4, id_token: LINE.idToken, line_name: LINE.name });
        TOKEN = r.token; if (CFG.test_mode) store(TOKEN);
        await showMe();
      } catch (e) {
        err.textContent = e.message;
        go.disabled = false; go.textContent = 'ดูบัตรแนะนำของฉัน';
      }
    }
  }

  var ST = {
    new: ['พร้อมส่ง', 'new'], rsv: ['เพื่อนกำลังใช้รหัส', 'rsv'], wait: ['รอสรุปผลวันนี้', 'wait'],
    ok: ['ผ่านเงื่อนไข 🎉', 'ok'], no: ['ไม่ผ่านเงื่อนไข', 'no'], void: ['หมดสิทธิ์', 'void']
  };
  async function showMe() {
    ME = await api('GET', '/api/ref-public/me');
    render();
  }
  function render() {
    var m = ME;
    document.getElementById('hero-title').innerHTML = 'สวัสดี<br>คุณ' + esc(m.first_name);
    document.getElementById('hero-sub').textContent = 'ส่งรหัสให้เพื่อนที่ยังไม่เคยมาใช้บริการ';
    var cards = m.cards.slice().sort(function (a, b) { return (a.status === 'new' ? 0 : 1) - (b.status === 'new' ? 0 : 1) || a.slot - b.slot; }).map(function (c) {
      var s = ST[c.status] || [c.status, ''];
      if (c.status === 'new') {
        return '<div class="card fresh"><div class="meta"><span>ใบที่ ' + c.slot + '</span><span class="st new">' + s[0] + '</span></div>' +
          '<div class="rcwrap">' + RefCard.html(cardData(c.code), 'line') + '</div>' +
          '<div class="acts"><button class="share" data-share="' + esc(c.code) + '">ส่งให้เพื่อนใน LINE</button><button data-img="' + esc(c.code) + '">บันทึกรูปบัตร</button></div></div>';
      }
      return '<div class="card used">' +
        '<div class="top"><b>LH หลอมทอง</b> บัตรแนะนำเพื่อน<span class="n">ใบที่ ' + c.slot + '</span></div>' +
        '<div class="body"><div class="code">' + esc(c.code) + '</div><span class="st ' + s[1] + '">' + s[0] + '</span>' +
        '<div class="who">' + (c.who ? (/^เพื่อน/.test(c.who) ? '' : 'คุณ') + esc(c.who) + ' · ' : '') + thDate(c.date) + '</div>' +
        '</div></div>';
    }).join('');
    app.innerHTML =
      '<div class="panel"><div class="hi"><div><b>' + esc(m.name) + '</b><small>' + esc(m.phone) + '</small></div>' +
      (m.line_name ? '<span class="line-chip">LINE · ' + esc(m.line_name) + '</span>' : '') + '</div>' +
      '<div class="stats"><div class="stat"><b>' + m.totals.ready + '</b><span>พร้อมส่ง</span></div><div class="stat"><b>' + m.totals.used + '</b><span>ใช้แล้ว</span></div><div class="stat"><b>' + m.totals.ok + '</b><span>ผ่านเงื่อนไข</span></div></div>' +
      (m.reward_text ? '<div class="reward">🎁 ' + esc(m.reward_text) + '</div>' : '') +
      '</div>' +
      '<section class="sec"><h2>บัตรของฉัน <small>ชุดที่ ' + m.set_no + '</small></h2>' + cards +
      (m.can_renew ? '<button class="btn gold" id="renew">ขอบัตรชุดใหม่</button>' : '') + '</section>' +
      howHtml() +
      '<p class="foot">ข้อมูลบัตรอัปเดตตามรายการที่ร้าน · มีคำถามติดต่อพนักงานที่ร้านได้เลย</p>' +
      (CFG.test_mode ? '<button class="btn ghost" id="out" style="margin-top:14px">ออกจากระบบ (โหมดทดลอง)</button>' : '');
    sizeCards();
    app.querySelectorAll('[data-share]').forEach(function (b) { b.addEventListener('click', function () { share(b.dataset.share); }); });
    app.querySelectorAll('[data-img]').forEach(function (b) { b.addEventListener('click', function () { saveImg(b.dataset.img); }); });
    var rn = document.getElementById('renew');
    if (rn) rn.addEventListener('click', async function () {
      rn.disabled = true;
      try { ME = await api('POST', '/api/ref-public/renew'); render(); } catch (e) { alert(e.message); rn.disabled = false; }
    });
    var out = document.getElementById('out');
    if (out) out.addEventListener('click', function () { TOKEN = null; store(null); showLogin(); });
  }
  function howHtml() {
    return '<section class="sec"><h2>วิธีใช้</h2><div class="how"><ol>' +
      '<li>ส่งรหัสหรือรูปบัตรให้เพื่อนที่<b>ยังไม่เคย</b>ใช้บริการร้าน</li>' +
      '<li>เพื่อนแจ้งรหัส/แสดงบัตรกับพนักงาน<b>ก่อน</b>ทำรายการ</li>' +
      '<li>เพื่อน (ลูกค้าใหม่) มียอดขายขั้นต่ำ ' + Number((ME || CFG || {}).min_amount || 0).toLocaleString('en-US') + ' บาท และทำธุรกรรมสำเร็จ บัตรจะขึ้นว่า “ผ่านเงื่อนไข” และคุณจะได้รับรางวัลตอบแทน</li>' +
      '</ol><p class="note">บัตร 1 ใบใช้ได้ 1 ครั้ง · ถ้าเพื่อนจองรหัสแล้วไม่ได้ทำรายการในวันนั้น บัตรใบนั้นจะหมดสิทธิ์</p></div></section>';
  }
  function shareText(code) {
    return '🎟️ บัตรแนะนำ LH หลอมทอง\nรหัส: ' + code + '\nแสดงรหัสนี้กับพนักงานก่อนทำรายการ (สำหรับลูกค้าที่ยังไม่เคยใช้บริการ)\nแนะนำโดย คุณ' + (ME ? ME.first_name : '');
  }
  async function share(code) {
    var text = shareText(code);
    try {
      if (window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
        await liff.shareTargetPicker([{ type: 'text', text: text }]);
        return;
      }
    } catch (e) {}
    if (navigator.share) { try { await navigator.share({ text: text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    location.href = 'https://line.me/R/share?text=' + encodeURIComponent(text);
  }
  function cardData(code) { return { code: code, name: ME ? ME.first_name : '', min: ME ? ME.min_amount : 0, footer: ME ? ME.footer : '' }; }
  function sizeCards() {
    document.querySelectorAll('.rcwrap').forEach(function (w) { w.style.setProperty('--u', (w.clientWidth / RefCard.W) + 'px'); w.style.height = (w.clientWidth * RefCard.H / RefCard.W) + 'px'; });
  }
  document.getElementById('rc-css').textContent = RefCard.css();
  window.addEventListener('resize', sizeCards);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeCards);
  async function saveImg(code) {
    var cv = await RefCard.toCanvas(cardData(code), 'line', 14);
    var url = cv.toDataURL('image/png');
    var ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<img alt="บัตรแนะนำ ' + esc(code) + '" src="' + url + '"><div class="t">กดค้างที่รูป แล้วเลือก “บันทึก” หรือ “ส่งต่อ”</div>' +
      '<div class="row"><a download="LH-' + esc(code) + '.png" href="' + url + '">ดาวน์โหลด</a><button type="button">ปิด</button></div>';
    ov.querySelector('button').addEventListener('click', function () { ov.remove(); });
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }
  start();
})();
</script>
</body>
</html>
