<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LH หลอมทอง | สาขาและเบอร์โทร</title>
<meta name="description" content="LH หลอมทอง 3 สาขา: ตลาดดวงแก้ว ปากเกร็ด, ตลาดชุมพลพาณิชย์ บางใหญ่, ดอนเมือง สรงประภา กดโทรหรือนำทางได้ทันที">
<meta property="og:title" content="LH หลอมทอง | สาขาและเบอร์โทร">
<meta property="og:description" content="กดโทรหรือนำทางไปยังสาขาที่ใกล้คุณได้ทันที">
<meta property="og:image" content="https://goldsilver00.github.io/price/m/logo.png">
<meta name="theme-color" content="#6d0c13">
<link rel="icon" href="../m/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Public+Sans:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#6d0c13; --deep:#4a1a1d; --red:#a31f24;
    --gold:#ffde59; --gold2:#ffbd59; --cream:#f1d9a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#140607;
    font-family:'Public Sans','Noto Sans Thai',sans-serif;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  .page{
    min-height:100vh; min-height:100dvh;
    max-width:440px; margin:0 auto;
    padding:max(22px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; justify-content:space-between; gap:14px;
    background:linear-gradient(170deg,var(--burgundy) 0%,#3a0a0e 45%,#140607 100%);
  }
  a{text-decoration:none}
  .th{font-family:'Noto Sans Thai',sans-serif}
  header{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  header{position:relative}
  header img.mascot{position:absolute;right:-4px;top:-6px;width:auto;height:118px;border:0;border-radius:0;box-shadow:none;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
  header img{width:80px;height:80px;border-radius:20px;border:1.5px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.45);object-fit:cover}
  .brand{display:flex;align-items:baseline;gap:8px;margin:0}
  .brand .lh{font-family:'Bodoni Moda',serif;font-weight:700;font-size:30px;letter-spacing:1px;color:var(--gold)}
  .brand .name{font-family:'Noto Sans Thai',sans-serif;font-weight:700;font-size:24px;color:var(--gold)}
  .sub{margin:0;font-size:13px;color:var(--cream)}
  main{display:flex;flex-direction:column;gap:11px}
  .card{padding:13px 15px;border-radius:18px;background:rgba(74,26,29,.78);border:1px solid rgba(255,222,89,.22);display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:10px}
  .no{flex:none;width:26px;height:26px;border-radius:13px;background:var(--gold);color:var(--burgundy);font-family:'Bodoni Moda',serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  .card h2{margin:0;flex:1 1 auto;min-width:0;font-family:'Noto Sans Thai',sans-serif;font-weight:700;font-size:16px;line-height:1.3}
  .pill{flex:none;padding:4px 9px;border-radius:999px;font-family:'Noto Sans Thai',sans-serif;font-size:11.5px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.10);color:#f0d6d6}
  .pill.open{background:rgba(134,239,172,.16);color:#a7f3c4}
  .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:#ecd3a2}
  .meta .dot{opacity:.5}
  .btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .btn{height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .call{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#3a0a0d;font-family:'Public Sans',sans-serif;box-shadow:0 4px 14px rgba(255,189,89,.25)}
  .nav{border:1.5px solid var(--gold);color:var(--gold);font-family:'Noto Sans Thai',sans-serif}
  button.btn{font-family:inherit;background:none;width:100%}
  .sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:480px;background:#2a0a0d;border-top:1.5px solid var(--gold);border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;font-family:'Noto Sans Thai',sans-serif}
  .sh-t{color:var(--gold);font-weight:700;font-size:17px;text-align:center}
  .sh-a{color:#e9d3b5;font-size:13px;text-align:center;margin-top:-4px}
  .sh-b{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;font:700 16px 'Noto Sans Thai',sans-serif;text-decoration:none;border:1.5px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer}
  .sh-b.g{background:var(--gold);color:#2a0a0d;border-color:var(--gold)}
  .sh-b.x{border-color:rgba(255,255,255,.2);color:#ccc}
  .sh-n{font-size:12px;line-height:1.5;color:#f3d9a8;background:rgba(255,222,89,.08);border-radius:10px;padding:8px 10px}
  footer{display:flex;flex-direction:column;gap:10px}
  .line{background:var(--red);color:#fff;font-family:'Noto Sans Thai',sans-serif;font-size:14px}
  .share{border:1px solid rgba(255,222,89,.35);background:rgba(255,255,255,.06);color:var(--gold);font-family:'Noto Sans Thai',sans-serif;font-size:14px}
  .tag .tmascot{height:40px;vertical-align:middle;margin:-10px 8px -8px 0}
  .tag{margin:0;text-align:center;font-family:'Bodoni Moda',serif;font-size:11px;letter-spacing:2px;color:#d9b98a}
  @media (max-height:700px){
    header img{width:60px;height:60px;border-radius:16px}
    header img.mascot{width:auto;height:96px}
    .brand .lh{font-size:26px}.brand .name{font-size:21px}
    .card{padding:11px 14px;gap:8px}
    .btn{height:42px}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <img src="../m/logo.png" alt="โลโก้ LH หลอมทอง">
    <img class="mascot" src="../img/mascot-wave.webp" alt="" aria-hidden="true">
    <h1 class="brand"><span class="lh">LH</span><span class="name">หลอมทอง</span></h1>
    <p class="sub th">เลือกสาขาที่สะดวก กดโทรหรือนำทางได้ทันที</p>
  </header>

  <main id="branches"></main>

  <footer>
    <div class="btns">
      <a class="btn line" href="https://line.me/R/ti/p/@lhom" target="_blank" rel="noopener">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span>แชทผ่าน LINE</span>
      </a>
      <button type="button" class="btn share" id="share" style="font:inherit;font-weight:700;font-family:'Noto Sans Thai',sans-serif;font-size:14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span id="shareLabel">แชร์ลิงก์</span>
      </button>
    </div>
    <p class="tag"><img class="tmascot" src="../img/mascot-run.webp" alt="" aria-hidden="true">LH LHOMTHONG · GOLD</p>
  </footer>
</div>

<script>
  var BRANCHES = [
    { name:'สาขาตลาดดวงแก้ว', area:'อ.ปากเกร็ด', open:540, close:1050, hours:'9:00–17:30', openText:'9:00', phone:'02-121-7261', tel:'021217261', lat:13.9467692, lng:100.5460115, pid:'ChIJCZG74FqD4jARXgpimIzsNJ4', gname:'LH หลอมทอง สาขาปากเกร็ด', addr:'77/556 หมู่ 1 ต.บ้านใหม่ อ.ปากเกร็ด จ.นนทบุรี 11120' },
    { name:'สาขาตลาดชุมพลพาณิชย์', area:'อ.บางใหญ่', open:510, close:1110, hours:'8:30–18:30', openText:'8:30', phone:'02-043-5353', tel:'020435353', lat:13.8469801, lng:100.3784346, pid:'ChIJc-0S_OyR4jAR6JkbVk-eXSw', gname:'LH หลอมทอง สาขาตลาดชุมพลพาณิชย์', addr:'ตลาดชุมพลพาณิชย์ 69/1 ห้อง U1-U2 ต.บางแม่นาง อ.บางใหญ่ จ.นนทบุรี 11140' },
    { name:'สาขาดอนเมือง', area:'สรงประภา', open:540, close:1050, hours:'9:00–17:30', openText:'9:00', phone:'02-077-4201', tel:'020774201', lat:13.9241794, lng:100.5982387, pid:'ChIJaT3SJ6uD4jAR4se1V41nok8', gname:'LH หลอมทอง สาขาดอนเมือง', addr:'222/5 ถ.สรงประภา แขวงสีกัน เขตดอนเมือง กรุงเทพฯ 10210' }
  ];
  var ICON_PIN = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  var ICON_CLOCK = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var ICON_PHONE = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICON_NAV = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>';

  function bangkokMinutes(){
    var d = new Date();
    return ((d.getUTCHours() + 7) % 24) * 60 + d.getUTCMinutes();
  }

  function render(){
    var m = bangkokMinutes();
    document.getElementById('branches').innerHTML = BRANCHES.map(function(b, i){
      var isOpen = m >= b.open && m < b.close;
      return '<section class="card">' +
        '<div class="row"><span class="no">' + (i + 1) + '</span><h2>' + b.name + '</h2>' +
        '<span class="pill' + (isOpen ? ' open' : '') + '">' + (isOpen ? '● เปิดอยู่' : 'ปิด · เปิด ' + b.openText) + '</span></div>' +
        '<div class="meta th">' + ICON_PIN + '<span>' + b.area + '</span><span class="dot">·</span>' + ICON_CLOCK + '<span>ทุกวัน ' + b.hours + ' น.</span></div>' +
        '<div class="btns">' +
          '<a class="btn call" href="tel:' + b.tel + '" aria-label="โทร ' + b.name + ' ' + b.phone + '">' + ICON_PHONE + '<span>' + b.phone + '</span></a>' +
          '<button type="button" class="btn nav" data-nav="' + i + '">' + ICON_NAV + '<span>นำทาง</span></button>' +
        '</div></section>';
    }).join('');
  }
  render();
  setInterval(render, 60000);

  // นำทาง: เลือกแอปแผนที่ (เปิดจาก LINE / Messenger บางเครื่องส่งลิงก์ให้ Google Maps ไม่ได้ เลยมีทางเลือกสำรอง)
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var inApp = /FBAN|FBAV|FB_IAB|Messenger|Line\/|Instagram/i.test(navigator.userAgent);
  document.getElementById('branches').addEventListener('click', function(e){
    var btn = e.target.closest('[data-nav]'); if (!btn) return;
    openNav(BRANCHES[Number(btn.getAttribute('data-nav'))]);
  });
  function openNav(b){
    var ll = b.lat + ',' + b.lng;
    var g = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(ll) + '&destination_place_id=' + b.pid + '&travelmode=driving';
    var a = 'https://maps.apple.com/?daddr=' + encodeURIComponent(ll) + '&q=' + encodeURIComponent(b.gname);
    var sh = document.createElement('div'); sh.className = 'sheet-wrap';
    sh.innerHTML = '<div class="sheet" role="dialog" aria-label="เลือกแอปนำทาง">' +
      '<div class="sh-t">นำทางไป ' + b.name + '</div><div class="sh-a">' + b.addr + '</div>' +
      '<a class="sh-b g" href="' + g + '">Google Maps</a>' +
      (isIOS ? '<a class="sh-b ap" href="' + a + '">Apple Maps (แผนที่ของ iPhone)</a>' : '') +
      '<button type="button" class="sh-b cp">คัดลอกที่อยู่</button>' +
      (inApp ? '<div class="sh-n">ถ้ากดแล้วเปิดไม่ได้ ให้กดปุ่ม ⋯ มุมบนขวา แล้วเลือก “เปิดในเบราว์เซอร์” (Safari / Chrome) แล้วกดนำทางอีกครั้ง</div>' : '') +
      '<button type="button" class="sh-b x">ปิด</button></div>';
    document.body.appendChild(sh);
    sh.addEventListener('click', function(e){ if (e.target === sh || e.target.classList.contains('x')) sh.remove(); });
    sh.querySelector('.cp').addEventListener('click', function(){
      var t = b.gname + ' ' + b.addr, btn = this;
      var done = function(){ btn.textContent = 'คัดลอกแล้ว ✓'; };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function(){ prompt('คัดลอกที่อยู่', t); });
      else prompt('คัดลอกที่อยู่', t);
    });
  }

  document.getElementById('share').addEventListener('click', function(){
    var url = location.href;
    var label = document.getElementById('shareLabel');
    if (navigator.share) {
      navigator.share({ title:'LH หลอมทอง | สาขาและเบอร์โทร', url:url }).catch(function(){});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function(){
        label.textContent = 'คัดลอกลิงก์แล้ว';
        setTimeout(function(){ label.textContent = 'แชร์ลิงก์'; }, 2000);
      });
    }
  });
</script>
</body>
</html>
