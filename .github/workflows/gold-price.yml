name: Gold price (สมาคมค้าทองคำ)

on:
  schedule:
    # every 5 minutes, 08:30-18:00 Bangkok (01:30-11:00 UTC). GitHub may run these a few minutes late.
    - cron: "*/5 1-10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install requests
      - run: python gold.py
      - name: Save to the website
        run: |
          git config user.name "goldsilver00"
          git config user.email "goldsilver00@users.noreply.github.com"
          git add gold.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gold price $(TZ=Asia/Bangkok date '+%F %H:%M')"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main && git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
