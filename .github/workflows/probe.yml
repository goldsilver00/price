name: probe
on:
  push:
    branches: [test-update]
    paths-ignore: ['probe-out.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python probe.py > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "goldsilver00"; git config user.email "goldsilver00@users.noreply.github.com"
          git add probe-out.txt && git commit -m "probe output" && git push
