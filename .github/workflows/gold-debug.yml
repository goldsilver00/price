name: gold-debug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dbg
          for u in "https://api.chnwt.dev/thai-gold-api/latest" "https://www.goldtraders.or.th/api/GoldPrices/Latest?readjson=false" "https://goldtraders.or.th/api/GoldPrices/Latest?readjson=false"; do
            echo "== $u" >> dbg/out.txt
            curl -sS -m 30 -A "Mozilla/5.0" -w "
HTTP %{http_code}
" "$u" 2>&1 | head -c 1500 >> dbg/out.txt; echo >> dbg/out.txt
          done
          git config user.name bot; git config user.email bot@x
          git checkout -b gold-debug; git add -f dbg; git commit -m dbg; git push -f origin gold-debug
